# herdr-orchestra model catalog — what the lead reads when it picks a model for a milestone.
# Override or add models in ~/.config/herdr-orchestra/models.toml (merged key by key over this file).
#
# Ratings are 1 (weak) to 5 (strong). They are starting points, not measurements made by this project:
# `evidence` says where each one comes from. `orch report` shows how each model really did in your runs
# (first-pass rate, fix rounds); lower or raise a rating in your own models.toml when they disagree.
#
#   kinds         agent kinds that can run the model (the id is what follows that kind's model flag)
#   tier          small | medium | high — what the model is trusted with (see [tiers])
#   reasoning     multi-step problem solving, debugging without a hint, weighing trade-offs
#   coding        writing and fixing code that passes its checks
#   architecture  design across modules, contracts between parts, large refactors
#   instructions  follows the task file, scope and output format reliably
#   tools         tool calling and long agentic sessions without getting lost
#   planning      breaking a goal into steps and keeping to them
#   speed         5 = fastest and cheapest to run, 1 = slowest and most expensive
#   context_k     context window in thousands of tokens
#   open_weights  true when the weights can be downloaded and self-hosted
#   evidence      where the ratings come from, with a date

[policy]
# Models nobody in a run may use: the lead, coders and the reviewer. Shell-style patterns, matched against the
# model id without caring about case. `orch sync` refuses a plan that names one.
deny = ["*fable*", "best", "*astra*"]
deny_why = "ultra-premium models are kept out of runs (edit [policy] deny in models.toml to change this)"

[tiers]
# A model may serve a tier only when its reasoning rating reaches the floor: coding skill alone never
# makes a model `high`.
small = { reasoning = 1, use = "classification, renames, docs, config, mechanical edits" }
medium = { reasoning = 3, use = "normal implementation, tests, debugging inside one module" }
high = { reasoning = 4, use = "the lead, contracts and architecture, cross-module refactors, auth/payments/schema, escalations" }

# ---------------------------------------------------------------- Claude Code (`claude --model <id>`)
[models.haiku]
kinds = ["claude"]
tier = "small"
reasoning = 2
coding = 3
architecture = 2
instructions = 4
tools = 4
planning = 2
speed = 5
context_k = 200
open_weights = false
evidence = "Claude Code alias for the current Haiku (code.claude.com/docs/en/model-config, 2026-11). Ratings: maintainer estimate from Anthropic's positioning of Haiku as its fast small model; not benchmarked here."

