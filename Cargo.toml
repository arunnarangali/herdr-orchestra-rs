[workspace]
resolver = "3"
members = ["crates/orch", "crates/orch-api", "crates/orch-core", "crates/orch-config", "crates/orch-herdr"]
# The desktop shell needs the system's webview libraries; it is built on its own
# (`cargo check --manifest-path gui/src-tauri/Cargo.toml`), so the workspace stays light.
exclude = ["gui/src-tauri"]

[workspace.package]
version = "5.0.0-dev"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
orch-core = { path = "crates/orch-core" }
orch-config = { path = "crates/orch-config" }
orch-herdr = { path = "crates/orch-herdr" }
orch-api = { path = "crates/orch-api" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
globset = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower = { version = "0.5", default-features = false }
utoipa = { version = "5", features = ["axum_extras"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
