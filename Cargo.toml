[workspace]
resolver = "3"
members = ["crates/orch", "crates/orch-core", "crates/orch-config", "crates/orch-herdr"]

[workspace.package]
version = "5.0.0-dev"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
orch-core = { path = "crates/orch-core" }
orch-config = { path = "crates/orch-config" }
orch-herdr = { path = "crates/orch-herdr" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
globset = "0.4"
tempfile = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
