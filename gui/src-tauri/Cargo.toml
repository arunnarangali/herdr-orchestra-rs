[package]
name = "herdr-orchestra-gui"
version = "0.0.0"
description = "Desktop shell for herdr-orchestra: starts `orch serve` for a project and hands the page its address and token"
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
orch-config = { path = "../../crates/orch-config" }

[lints.clippy]
all = { level = "warn", priority = -1 }
